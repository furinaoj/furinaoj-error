<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FurinaOJ - Bảo trì hệ thống</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            animation: gradientBG 15s ease infinite;
            background-size: 400% 400%;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .logo-text {
            background: linear-gradient(90deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 3s ease-in-out infinite alternate;
        }
        @keyframes shine {
            from { background-position: 0% 50%; }
            to { background-position: 100% 50%; }
        }
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center text-white p-4">
    <div class="max-w-2xl w-full text-center mx-4">
        <!-- Logo với animation -->
        <div class="mb-8 transform hover:scale-105 transition duration-500">
            <h1 class="text-4xl md:text-5xl font-bold mb-2 logo-text">Furina<span class="text-white">OJ</span></h1>
            <p class="text-lg md:text-xl text-gray-300">Furina Online Judge</p>
        </div>
        
        <!-- Thông báo bảo trì -->
        <div class="bg-white/10 backdrop-blur-md rounded-xl p-6 md:p-8 border border-white/10 shadow-2xl mb-8 transform hover:-translate-y-1 transition duration-300">
            <div class="flex justify-center mb-6">
                <!-- Icon tools với animation xoay -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14 md:h-16 md:w-16 text-blue-400 animate-spin-slow" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z" />
                </svg>
            </div>
            <h2 class="text-2xl md:text-3xl font-bold mb-4">HỆ THỐNG ĐANG BẢO TRÌ</h2>
            <p class="text-base md:text-lg text-gray-300 mb-6">
                Chúng tôi đang nâng cấp hệ thống để mang đến trải nghiệm tốt hơn.
                FurinaOJ sẽ trở lại trong thời gian sớm nhất. Xin cảm ơn sự kiên nhẫn của bạn!
            </p>
            
            <!-- Thanh tiến trình với animation -->
            <div class="w-full bg-gray-700 rounded-full h-2.5 mb-6 overflow-hidden">
                <div class="bg-gradient-to-r from-blue-500 to-purple-600 h-2.5 rounded-full animate-progress"></div>
            </div>
            
            <!-- Trạng thái với animation nhấp nháy -->
            <div class="flex items-center justify-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-green-400 pulse"></div>
                <span class="text-gray-300">Đang tiến hành bảo trì...</span>
            </div>
        </div>
        
        <!-- Thông tin liên hệ -->
        <div class="text-gray-400 text-sm md:text-base">
            <p class="mb-2">Truy cập: <a href="https://furinaoj.io.vn" class="text-blue-400 hover:text-blue-300 transition underline">furinaoj.io.vn</a></p>
            <p>© 2025 FurinaOJ. Bảo lưu mọi quyền.</p>
        </div>
    </div>

    <!-- Animation background particles -->
    <div class="fixed inset-0 overflow-hidden -z-10">
        <div class="absolute top-0 left-0 w-full h-full">
            <div class="particle absolute rounded-full bg-white/10" style="top: 20%; left: 10%; width: 4px; height: 4px;"></div>
            <div class="particle absolute rounded-full bg-blue-400/20" style="top: 60%; left: 30%; width: 6px; height: 6px;"></div>
            <div class="particle absolute rounded-full bg-purple-400/20" style="top: 40%; left: 80%; width: 5px; height: 5px;"></div>
            <div class="particle absolute rounded-full bg-white/10" style="top: 80%; left: 50%; width: 3px; height: 3px;"></div>
        </div>
    </div>

    <script>
        // Thêm animation cho các particle
        document.querySelectorAll('.particle').forEach((el, index) => {
            const duration = Math.random() * 10 + 10;
            const delay = Math.random() * 5;
            const directionX = Math.random() > 0.5 ? 1 : -1;
            const directionY = Math.random() > 0.5 ? 1 : -1;
            
            el.style.animation = `float ${duration}s ease-in-out ${delay}s infinite alternate`;
            el.style.setProperty('--move-x', `${Math.random() * 100 * directionX}px`);
            el.style.setProperty('--move-y', `${Math.random() * 100 * directionY}px`);
        });

        // Thêm keyframes động
        const styleSheet = document.styleSheets[0];
        styleSheet.insertRule(`
            @keyframes float {
                to {
                    transform: translate(var(--move-x), var(--move-y));
                }
            }
        `);
        styleSheet.insertRule(`
            @keyframes animate-progress {
                0% { width: 0%; }
                100% { width: 100%; }
            }
            .animate-progress {
                animation: animate-progress 3s ease-in-out infinite alternate;
            }
        `);
        styleSheet.insertRule(`
            @keyframes spin-slow {
                to { transform: rotate(360deg); }
            }
            .animate-spin-slow {
                animation: spin-slow 8s linear infinite;
            }
        `);
    </script>
</body>
</html>
